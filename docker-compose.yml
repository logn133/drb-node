services:
  icecast:
    build: ./icecast
    restart: unless-stopped
    network_mode: host
    environment:
      ICECAST_SOURCE_PASSWORD: ${ICECAST_SOURCE_PASSWORD:-hackme}
      ICECAST_ADMIN_PASSWORD: ${ICECAST_ADMIN_PASSWORD:-admin}

  op25:
    build: ./op25-container
    restart: unless-stopped
    privileged: true
    network_mode: host
    env_file: .env
    volumes:
      - ./configs:/configs
      - /dev:/dev
      - ./op25-container/app:/app
      - pulse_socket:/run/pulse
    depends_on:
      - icecast

  edge-node:
    build: ./drb-edge-node
    restart: unless-stopped
    network_mode: host
    env_file: .env
    volumes:
      - ./configs:/configs
      - ./recordings:/recordings
      - ./drb-edge-node/app:/app/app
      - pulse_socket:/run/pulse
    environment:
      PULSE_SERVER: unix:/run/pulse/native
    depends_on:
      - icecast
      - op25

volumes:
  pulse_socket:

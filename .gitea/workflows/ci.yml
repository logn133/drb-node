name: CI

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: drb-edge-node
    steps:
      - uses: actions/checkout@v4

      - name: Install dependencies
        run: python3 -m pip install --break-system-packages -r requirements.txt pytest

      - name: Run tests
        run: python3 -m pytest tests -v

  test-op25:
    # Config generation + tk_drb_conv state machine only (node-26#24) — no
    # GNU Radio here; tests/test_conventional.py stubs OP25's own modules.
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: op25-container
    steps:
      - uses: actions/checkout@v4

      - name: Install dependencies
        run: python3 -m pip install --break-system-packages -r requirements.txt pytest httpx

      - name: Run tests
        run: python3 -m pytest tests -v

  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Lint
        run: |
          python3 -m pip install --break-system-packages flake8
          python3 -m flake8 drb-edge-node/app --max-line-length=120

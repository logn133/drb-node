services:
  icecast:
    build: ./icecast
    restart: unless-stopped
    network_mode: host
    environment:
      ICECAST_SOURCE_PASSWORD: ${ICECAST_SOURCE_PASSWORD:-hackme}
      ICECAST_ADMIN_PASSWORD: ${ICECAST_ADMIN_PASSWORD:-admin}

  op25:
    build: ./op25-container
    restart: unless-stopped
    privileged: true
    network_mode: host
    volumes:
      - ./configs:/configs
      - /dev:/dev
    depends_on:
      - icecast

  edge-node:
    build: ./drb-edge-node
    restart: unless-stopped
    network_mode: host
    env_file: .env
    volumes:
      - ./configs:/configs
      - ./recordings:/recordings
    depends_on:
      - icecast
      - op25
